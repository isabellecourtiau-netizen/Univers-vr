<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Univers VR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eef2ee;--card:#f8faf7;--ink:#1f2b27;--muted:#5d6b66;--line:#d5ddd8;--accent:#2f6f62}
@media (prefers-color-scheme: dark){:root{--bg:#141a18;--card:#1b2320;--ink:#e7eeea;--muted:#9aaba4;--line:#2c3833;--accent:#6fb8a6;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;padding:40px 16px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font:400 34px/1.1 "Young Serif",Georgia,serif;margin:0}
p{margin:0;color:var(--muted)}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:var(--ink);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
a.card strong{font-size:19px;display:block;margin-bottom:4px}
</style>
</head>
<body>
<main>
  <h1>Univers VR</h1>
  <p>Ouvrez cette page dans le navigateur du Meta Quest, puis choisissez un univers.</p>
  <a class="card" href="seuils-araignee.html">
    <strong>Seuils araignée</strong>
    <p>Pièce calme, exposition progressive en 6 paliers, retour au calme à tout moment.</p>
  </a>
</main>
</body>
</html>
